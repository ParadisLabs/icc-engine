name: ICC Engine Scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # OpsHub triggers this repo with a repository_dispatch (type: icc.run).
  repository_dispatch:
    types: [icc.run, opshub.run]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Main engine scan
        run: |
          set -o pipefail
          python engine/engine.py 2>&1 | tee main_scan.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Button presses recorded by OpsHub (POST /acks) are applied at scan start
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Pressure scan (V3)
        run: python engine/pressure.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sync events to OpsHub
        run: python engine/hub_sync.py
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Fail workflow when no symbols were analysed
        if: always()
        run: |
          python - <<'PY'
          import pathlib, re, sys
          log = pathlib.Path('main_scan.log')
          if not log.exists():
              print('ICC health gate: main scan log is missing')
              sys.exit(1)
          text = log.read_text(errors='replace')
          match = re.search(r'\[icc\] analysed (\d+)/(\d+) symbols', text)
          if not match:
              print('ICC health gate: could not find the analysed-symbol summary')
              sys.exit(1)
          analysed, total = map(int, match.groups())
          print(f'ICC health gate: analysed {analysed}/{total} symbols')
          if analysed == 0:
              print('ICC health gate: FAIL — no symbols received usable market data')
              sys.exit(1)
          PY

      - name: Commit memory
        run: |
          git config user.name "icc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "memory update [skip ci]"
          git push
